name: Link checker

# Detecta enlaces caídos (demos de proyectos, sociales, sitemap) y avisa por Telegram.
# Habría detectado el bug del link muerto de nexus-impertodo.

on:
  schedule:
    - cron: "0 9 * * *" # diario 09:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chequear enlaces
        env:
          SITE_URL: https://caskiuz.vercel.app
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/check-links.mjs
